name: security

# The security gate for every change to Zorderz. The sentinel + unit + lint jobs are fast and
# have no external services; they are the must-pass gates. phpcs and the WordPress-harness
# integration tests add depth. Branch protection on main should require at least: sentinel,
# unit, lint.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sentinel:
    name: Hypocrite-commit sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the diff base is available
          persist-credentials: false
      - name: Scan added lines for security tells
        run: bash .github/scripts/security-sentinel.sh

  lint:
    name: PHP lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: php -l on changed PHP files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          [ -z "$base" ] && base="HEAD~1"
          changed="$(git diff --name-only "$base"...HEAD -- '*.php' || true)"
          [ -z "$changed" ] && echo "no PHP changes" && exit 0
          rc=0
          for f in $changed; do [ -f "$f" ] && { php -l "$f" || rc=1; }; done
          exit $rc

  unit:
    name: Unit tests (security invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: PHPUnit unit suite
        run: vendor/bin/phpunit -c phpunit.xml.dist

  phpcs:
    name: Security standards (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: PHP_CodeSniffer (security ruleset, changed LINES only)
        # Runs the security-only ruleset, then reports ONLY findings that land on the lines this
        # change actually touched (.github/scripts/phpcs-changed-lines.py). The codebase predates
        # WPCS, so a whole-file scan of any touched legacy file is red forever and trains everyone
        # to ignore the gate; diff-line scoping keeps a contributor answerable for their own diff
        # while still catching a real new vulnerability. Full cleanup is `composer lint`.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          [ -z "$base" ] && base="HEAD~1"
          changed="$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.php' | grep -vE '(^|/)(bundled|vendor|tests|dist)/' || true)"
          if [ -z "$changed" ]; then echo "no PHP changes to scan"; exit 0; fi
          echo "Scanning changed files (reporting only changed lines):"; echo "$changed"
          vendor/bin/phpcs -q --standard=phpcs-security.xml.dist --report=json $changed > phpcs-report.json || true
          python3 .github/scripts/phpcs-changed-lines.py "$base" HEAD phpcs-report.json

  integration:
    name: Integration tests (WordPress harness)
    runs-on: ubuntu-latest
    # Advisory until confirmed green in real CI: a harness or DB-setup hiccup should not block a
    # merge. Do not add this job to required checks until it has passed at least once. The
    # sentinel, unit, and lint jobs are the enforced gate.
    continue-on-error: true
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Install Subversion
        # install-wp-tests.sh fetches the WordPress test suite over svn, which ubuntu-latest no
        # longer ships by default (that was the exit 127 "command not found"). This job stays
        # continue-on-error / advisory regardless.
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest
      - name: PHPUnit integration suite
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
